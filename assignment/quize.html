
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quiz</title>

    <link rel="stylesheet" href="quize.css">
</head>

<body>

    <div class="container" id="login">

        <h1>Quiz Login</h1>

        <p class="subtitle">Login to start your quiz</p>

        <form id="login-form">

            <label for="username">Name:</label>
            <input
                type="text"
                id="username"
                placeholder="Enter your name"
                required
            >
            <label for="roll-no">Roll No.:</label>
            <input
                type="text"
                id="roll-no"
                placeholder="Enter your roll No"
                required
            >
            <p ><strong>Section:</strong></p>

            <label>
                <input
                    type="radio"
                    name="section"
                    value="A"
                    required
                >
                Section A
            </label>

            <br>

            <label>
                <input
                    type="radio"
                    name="section"
                    value="B"
                >
                Section B
            </label>

            <br>

            <label>
                <input
                    type="radio"
                    name="section"
                    value="C"
                >
                Section C
            </label>

            <br><br>

           
            <button type="submit">Login</button>

        </form>

        <p id="login-message"></p>

    </div>


   
    <div class="container hidden" id="quiz-page">

        <h1>Quiz</h1>

        <p id="welcome-user"></p>

        <p id="question-number"></p>

        <h2 id="question"></h2>

        <div id="options"></div>

        <button id="next-btn">Next</button>

    </div>


    
    <div class="container hidden" id="result-page">

        <h1>Quiz Completed!</h1>

        <p id="score"></p>

        <button id="restart-btn">Restart Quiz</button>

        <button id="logout-btn">Logout</button>

    </div>


    <script src="quize.js"></script>

</body>

</html>
